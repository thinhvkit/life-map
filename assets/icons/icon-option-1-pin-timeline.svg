<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#132240"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)" rx="224"/>

  <!-- Subtle grid lines (map feel) -->
  <g opacity="0.06" stroke="#60A5FA" stroke-width="1.5">
    <line x1="256" y1="80" x2="256" y2="944"/>
    <line x1="512" y1="80" x2="512" y2="944"/>
    <line x1="768" y1="80" x2="768" y2="944"/>
    <line x1="80" y1="256" x2="944" y2="256"/>
    <line x1="80" y1="512" x2="944" y2="512"/>
    <line x1="80" y1="768" x2="944" y2="768"/>
  </g>

  <!-- Timeline vertical line -->
  <line x1="210" y1="160" x2="210" y2="880" stroke="#1E3A5F" stroke-width="8" stroke-linecap="round"/>

  <!-- Timeline dots (bigger) -->
  <circle cx="210" cy="240" r="16" fill="#2563EB" opacity="0.55"/>
  <circle cx="210" cy="390" r="16" fill="#3B82F6" opacity="0.65"/>
  <circle cx="210" cy="540" r="16" fill="#60A5FA" opacity="0.75"/>
  <circle cx="210" cy="690" r="18" fill="#93C5FD" opacity="0.95"/>

  <!-- Timeline horizontal ticks -->
  <line x1="210" y1="240" x2="300" y2="240" stroke="#2563EB" stroke-width="4" opacity="0.55"/>
  <line x1="210" y1="390" x2="320" y2="390" stroke="#3B82F6" stroke-width="4" opacity="0.65"/>
  <line x1="210" y1="540" x2="340" y2="540" stroke="#60A5FA" stroke-width="4" opacity="0.75"/>

  <!-- Map Pin — centered right, significantly larger -->
  <g transform="translate(590, 460)">
    <!-- Pin shadow glow -->
    <ellipse cx="0" cy="330" rx="140" ry="30" fill="#3B82F6" opacity="0.18"/>

    <!-- Pin body -->
    <path d="M0,-240 C-148,-240 -220,-156 -220,-72
             C-220,72 0,330 0,330
             C0,330 220,72 220,-72
             C220,-156 148,-240 0,-240 Z"
          fill="url(#pinGrad)" stroke="#93C5FD" stroke-width="6"/>

    <!-- Pin inner circle -->
    <circle cx="0" cy="-80" r="88" fill="#0A1628" stroke="#93C5FD" stroke-width="5"/>

    <!-- Pulsing rings -->
    <circle cx="0" cy="-80" r="56" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.3"/>

    <!-- Core dot -->
    <circle cx="0" cy="-80" r="38" fill="#60A5FA"/>
    <circle cx="0" cy="-80" r="20" fill="#93C5FD"/>
  </g>
</svg>
