<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="pinGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Pin body -->
  <path d="M100,0 C56,0 20,36 20,80 C20,140 100,230 100,230 C100,230 180,140 180,80 C180,36 144,0 100,0 Z"
        fill="url(#pinGrad)" stroke="#93C5FD" stroke-width="3"/>

  <!-- Pin inner circle -->
  <circle cx="100" cy="72" r="38" fill="#0A1628" stroke="#93C5FD" stroke-width="2.5"/>

  <!-- Pulsing dot inside pin -->
  <circle cx="100" cy="72" r="16" fill="#60A5FA"/>
  <circle cx="100" cy="72" r="9" fill="#93C5FD"/>

  <!-- Shadow ellipse -->
  <ellipse cx="100" cy="252" rx="50" ry="12" fill="#3B82F6" opacity="0.15"/>

  <!-- Timeline line below -->
  <line x1="100" y1="248" x2="100" y2="280" stroke="#1E3A5F" stroke-width="3" stroke-linecap="round"/>
</svg>
