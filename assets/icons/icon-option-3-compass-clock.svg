<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#132240"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg3)" rx="224"/>

  <!-- Outer glow ring — bigger radius -->
  <circle cx="512" cy="512" r="430" fill="none" stroke="#1E3A5F" stroke-width="2" opacity="0.5"/>

  <!-- Main circle ring — bigger, bolder -->
  <circle cx="512" cy="512" r="370" fill="none" stroke="url(#ringGrad)" stroke-width="12"/>

  <!-- Inner accent ring -->
  <circle cx="512" cy="512" r="340" fill="none" stroke="#1E3A5F" stroke-width="2" opacity="0.4"/>

  <!-- Compass/clock tick marks — bigger -->
  <g stroke="#3B82F6" stroke-width="6" opacity="0.7">
    <!-- N -->
    <line x1="512" y1="152" x2="512" y2="198"/>
    <!-- E -->
    <line x1="872" y1="512" x2="826" y2="512"/>
    <!-- S -->
    <line x1="512" y1="872" x2="512" y2="826"/>
    <!-- W -->
    <line x1="152" y1="512" x2="198" y2="512"/>
  </g>

  <!-- Small tick marks — bigger -->
  <g stroke="#2563EB" stroke-width="3" opacity="0.45">
    <line x1="628" y1="162" x2="614" y2="188"/>
    <line x1="740" y1="296" x2="720" y2="316"/>
    <line x1="862" y1="628" x2="836" y2="614"/>
    <line x1="728" y1="740" x2="708" y2="720"/>
    <line x1="396" y1="862" x2="410" y2="836"/>
    <line x1="284" y1="728" x2="304" y2="708"/>
    <line x1="162" y1="396" x2="188" y2="410"/>
    <line x1="296" y1="284" x2="316" y2="304"/>
  </g>

  <!-- Compass diamond / North pointer — larger -->
  <polygon points="512,182 536,490 512,516 488,490" fill="#60A5FA" opacity="0.95"/>
  <polygon points="512,842 536,534 512,508 488,534" fill="#1E3A5F" stroke="#2563EB" stroke-width="2"/>

  <!-- Clock hand — longer, bolder -->
  <line x1="512" y1="512" x2="730" y2="340" stroke="#93C5FD" stroke-width="9" stroke-linecap="round"/>

  <!-- Second hand (short) -->
  <line x1="512" y1="512" x2="400" y2="620" stroke="#3B82F6" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  <!-- Center dot — bigger -->
  <circle cx="512" cy="512" r="26" fill="#0A1628" stroke="#60A5FA" stroke-width="6"/>
  <circle cx="512" cy="512" r="12" fill="#93C5FD"/>

  <!-- Location pulse rings at hand tip -->
  <circle cx="730" cy="340" r="30" fill="#93C5FD" opacity="0.12"/>
  <circle cx="730" cy="340" r="18" fill="#93C5FD" opacity="0.45"/>
  <circle cx="730" cy="340" r="9" fill="#93C5FD"/>
</svg>
