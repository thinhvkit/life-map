<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#132240"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg3)" rx="224"/>

  <!-- Outer glow ring -->
  <circle cx="512" cy="512" r="340" fill="none" stroke="#1E3A5F" stroke-width="2" opacity="0.5"/>

  <!-- Main circle ring -->
  <circle cx="512" cy="512" r="280" fill="none" stroke="url(#ringGrad)" stroke-width="8"/>

  <!-- Compass/clock tick marks -->
  <g stroke="#3B82F6" stroke-width="4" opacity="0.6">
    <!-- N -->
    <line x1="512" y1="242" x2="512" y2="272"/>
    <!-- E -->
    <line x1="782" y1="512" x2="752" y2="512"/>
    <!-- S -->
    <line x1="512" y1="782" x2="512" y2="752"/>
    <!-- W -->
    <line x1="242" y1="512" x2="272" y2="512"/>
  </g>

  <!-- Small tick marks -->
  <g stroke="#2563EB" stroke-width="2" opacity="0.4">
    <line x1="610" y1="249" x2="600" y2="270"/>
    <line x1="700" y1="330" x2="684" y2="346"/>
    <line x1="775" y1="414" x2="754" y2="424"/>
    <line x1="775" y1="610" x2="754" y2="600"/>
    <line x1="700" y1="694" x2="684" y2="678"/>
    <line x1="610" y1="775" x2="600" y2="754"/>
    <line x1="414" y1="775" x2="424" y2="754"/>
    <line x1="324" y1="694" x2="340" y2="678"/>
    <line x1="249" y1="610" x2="270" y2="600"/>
    <line x1="249" y1="414" x2="270" y2="424"/>
    <line x1="324" y1="330" x2="340" y2="346"/>
    <line x1="414" y1="249" x2="424" y2="270"/>
  </g>

  <!-- Compass diamond / North pointer -->
  <polygon points="512,260 530,480 512,500 494,480" fill="#60A5FA" opacity="0.9"/>
  <polygon points="512,764 530,544 512,524 494,544" fill="#1E3A5F" stroke="#2563EB" stroke-width="1"/>

  <!-- Clock hand (representing time/timeline) -->
  <line x1="512" y1="512" x2="680" y2="400" stroke="#93C5FD" stroke-width="6" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="512" cy="512" r="18" fill="#0A1628" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="512" cy="512" r="8" fill="#93C5FD"/>

  <!-- Location pulse rings -->
  <circle cx="680" cy="400" r="20" fill="#93C5FD" opacity="0.15"/>
  <circle cx="680" cy="400" r="10" fill="#93C5FD" opacity="0.5"/>
  <circle cx="680" cy="400" r="5" fill="#93C5FD"/>
</svg>
