<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#132240"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="30%" stop-color="#3B82F6"/>
      <stop offset="60%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg2)" rx="224"/>

  <!-- Subtle radial glow -->
  <circle cx="512" cy="512" r="380" fill="#1E3A5F" opacity="0.12"/>

  <!-- Route path - a flowing S-curve representing a journey -->
  <path d="M260,760 C260,760 320,620 420,560 C520,500 600,580 600,480 C600,380 480,340 520,260 C560,180 680,220 740,280"
        fill="none" stroke="url(#pathGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Path glow -->
  <path d="M260,760 C260,760 320,620 420,560 C520,500 600,580 600,480 C600,380 480,340 520,260 C560,180 680,220 740,280"
        fill="none" stroke="#60A5FA" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.12"/>

  <!-- Start point -->
  <circle cx="260" cy="760" r="24" fill="#1E3A5F" stroke="#3B82F6" stroke-width="5"/>
  <circle cx="260" cy="760" r="10" fill="#3B82F6"/>

  <!-- Waypoints along the path -->
  <circle cx="420" cy="560" r="16" fill="#1E3A5F" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="420" cy="560" r="7" fill="#60A5FA"/>

  <circle cx="600" cy="480" r="16" fill="#1E3A5F" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="600" cy="480" r="7" fill="#60A5FA"/>

  <!-- End point / current location - larger, more prominent -->
  <circle cx="740" cy="280" r="36" fill="#3B82F6" opacity="0.15"/>
  <circle cx="740" cy="280" r="26" fill="#0F2240" stroke="#93C5FD" stroke-width="5"/>
  <circle cx="740" cy="280" r="12" fill="#93C5FD"/>

  <!-- Small decorative dots (places visited) -->
  <circle cx="340" cy="660" r="5" fill="#2563EB" opacity="0.5"/>
  <circle cx="480" cy="520" r="5" fill="#3B82F6" opacity="0.5"/>
  <circle cx="560" cy="540" r="5" fill="#3B82F6" opacity="0.4"/>
  <circle cx="540" cy="360" r="5" fill="#60A5FA" opacity="0.5"/>
  <circle cx="640" cy="300" r="5" fill="#60A5FA" opacity="0.4"/>
</svg>
