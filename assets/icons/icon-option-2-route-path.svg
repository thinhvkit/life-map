<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#132240"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="30%" stop-color="#3B82F6"/>
      <stop offset="60%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg2)" rx="224"/>

  <!-- Subtle radial glow -->
  <circle cx="512" cy="512" r="440" fill="#1E3A5F" opacity="0.1"/>

  <!-- Route path glow (thicker, wider spread) -->
  <path d="M180,860 C180,860 280,640 420,560
           C560,480 660,580 660,440
           C660,300 500,260 560,160
           C620,60 780,100 860,180"
        fill="none" stroke="#60A5FA" stroke-width="52"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.10"/>

  <!-- Route path — much thicker, fills more canvas -->
  <path d="M180,860 C180,860 280,640 420,560
           C560,480 660,580 660,440
           C660,300 500,260 560,160
           C620,60 780,100 860,180"
        fill="none" stroke="url(#pathGrad)" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Start point — larger -->
  <circle cx="180" cy="860" r="36" fill="#1E3A5F" stroke="#3B82F6" stroke-width="7"/>
  <circle cx="180" cy="860" r="16" fill="#3B82F6"/>

  <!-- Waypoint 1 -->
  <circle cx="420" cy="560" r="26" fill="#1E3A5F" stroke="#60A5FA" stroke-width="6"/>
  <circle cx="420" cy="560" r="11" fill="#60A5FA"/>

  <!-- Waypoint 2 -->
  <circle cx="660" cy="440" r="26" fill="#1E3A5F" stroke="#60A5FA" stroke-width="6"/>
  <circle cx="660" cy="440" r="11" fill="#60A5FA"/>

  <!-- End point / current location — largest, most prominent -->
  <circle cx="860" cy="180" r="56" fill="#3B82F6" opacity="0.15"/>
  <circle cx="860" cy="180" r="42" fill="#0F2240" stroke="#93C5FD" stroke-width="7"/>
  <circle cx="860" cy="180" r="20" fill="#93C5FD"/>

  <!-- Decorative dots (places visited) — bigger -->
  <circle cx="300" cy="720" r="8" fill="#2563EB" opacity="0.55"/>
  <circle cx="480" cy="530" r="8" fill="#3B82F6" opacity="0.55"/>
  <circle cx="590" cy="540" r="8" fill="#3B82F6" opacity="0.45"/>
  <circle cx="560" cy="320" r="8" fill="#60A5FA" opacity="0.55"/>
  <circle cx="700" cy="240" r="8" fill="#60A5FA" opacity="0.45"/>
</svg>
